<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="60" height="40">
  <!-- Black Stripe -->
  <rect x="0" y="0" width="60" height="12" fill="#000000" />
  <!-- Upper White Fimbriation -->
  <rect x="0" y="12" width="60" height="2" fill="#FFFFFF" />
  <!-- Red Stripe -->
  <rect x="0" y="14" width="60" height="12" fill="#DA121A" />
  <!-- Lower White Fimbriation -->
  <rect x="0" y="26" width="60" height="2" fill="#FFFFFF" />
  <!-- Green Stripe -->
  <rect x="0" y="28" width="60" height="12" fill="#078930" />
  <!-- Blue Chevron (Hoist Triangle) -->
  <polygon points="0,0 28,20 0,40" fill="#003B99" />
  <!-- Gold Star (Tilted pointing to the fly) -->
  <polygon points="16,20 11.94,21.41 11.85,25.71 9.26,22.28 5.15,23.53 7.6,20 5.15,16.47 9.26,17.72 11.85,14.29 11.94,18.59" fill="#FFD100" />
</svg>
